<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine? 💙</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89CFF0, #1E90FF);
            overflow: hidden;
            color: white;
        }

        h1 {
            margin-top: 60px;
            font-size: 38px;
        }

        img {
            width: 260px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            position: absolute;
            transition: 0.3s;
        }

        #yesBtn {
            background-color: #0d47a1;
            color: white;
            left: 38%;
            top: 70%;
        }

        #noBtn {
            background-color: #ff4d4d;
            color: white;
            left: 55%;
            top: 70%;
        }

        .popup {
            display: none;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #1E90FF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

    <!-- Darth Vader Entrance Music -->
    <audio autoplay loop>
        <source src="vader.mp3" type="audio/mpeg">
    </audio>

    <h1>Will You Be My Valentine? 💙</h1>

    <!-- YOUR PICTURE -->
    <img src="us.jpeg" alt="us">

    <button id="yesBtn" onclick="yesClicked()">YES 💙</button>
    <button id="noBtn">NO 😢</button>

    <div class="popup" id="popup">
        <h2>Are you sureeee? 🥺</h2>
        <p>Oyen is judging you right now 🐱</p>
        <button onclick="closePopup()">Okay fine…</button>
    </div>

<script>

    const noBtn = document.getElementById("noBtn");

    // Desktop dodge
    document.addEventListener("mousemove", function(e) {
        const rect = noBtn.getBoundingClientRect();
        const distance = Math.hypot(
            e.clientX - (rect.left + rect.width / 2),
            e.clientY - (rect.top + rect.height / 2)
        );

        if (distance < 100) {
            const randomX = Math.random() * (window.innerWidth - 100);
            const randomY = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        }
    });

    // Mobile popup
    noBtn.addEventListener("click", function() {
        if (window.innerWidth < 768) {
            document.getElementById("popup").style.display = "block";
        }
    });

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }

    function yesClicked() {

        document.body.innerHTML = `
            <style>
                body {
                    margin: 0;
                    background: linear-gradient(135deg, #1E90FF, #00008B);
                    text-align: center;
                    font-family: Arial, sans-serif;
                    color: white;
                    overflow: hidden;
                }

                h1 {
                    margin-top: 120px;
                    font-size: 55px;
                }

                h2 {
                    margin-top: 20px;
                    font-size: 28px;
                }

                .garfield {
                    margin-top: 40px;
                    width: 300px;
                    border-radius: 20px;
                    box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
                    animation: popUp 1.8s ease forwards;
                }

                @keyframes popUp {
                    0% { transform: translateY(400px); opacity: 0; }
                    60% { transform: translateY(-20px); opacity: 1; }
                    80% { transform: translateY(10px); }
                    100% { transform: translateY(0); }
                }
            </style>

            <h1>YAYYYYYY 💙🎉</h1>
            <h2>You are officially my Valentine 😎</h2>
            <h2>Garfield approves this relationship 🐱</h2>

            <img src="garfield-fat.jpg" class="garfield">
        `;

        // Confetti blast
        setTimeout(() => {
            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.6 }
            });
        }, 300);

        // Extra side rain
        setTimeout(() => {
            confetti({
                particleCount: 150,
                angle: 60,
                spread: 70,
                origin: { x: 0 }
            });
            confetti({
                particleCount: 150,
                angle: 120,
                spread: 70,
                origin: { x: 1 }
            });
        }, 800);
    }

</script>

</body>
</html>
